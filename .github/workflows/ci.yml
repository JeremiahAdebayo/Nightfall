name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # Base dependencies include torch/scipy/sklearn, which the tests
        # need; dev adds pytest. No dataset or GPU required (CPU smoke
        # tests only).
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -q
